# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: srv
    binary: srv
    ldflags:
      - -X "main.version={{.Env.VERSION}}"
    goarch:
     - amd64
     - arm64

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch}}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: ["zip"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  name_template: "{{ .Env.VERSION }}"

checksum:
  name_template: 'checksums.txt'
